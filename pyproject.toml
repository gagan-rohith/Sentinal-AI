[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Multi-agent SRE incident response platform (LangGraph + Elasticsearch hybrid RAG + MCP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "elasticsearch[async]>=8.13,<9",
    "numpy>=1.26",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.0",
    "anthropic>=1.8",
    "mcp>=2.2,<3",
    "prometheus-client>=0.20",
    "langsmith>=0.14",
    "a2a-sdk[http-server,telemetry]>=1.1,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
# Local embedding and reranking models. Install CPU torch first to avoid the CUDA build:
# pip install torch --index-url https://download.pytorch.org/whl/cpu
ml = [
    "sentence-transformers>=6.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "agents*",
    "auth*",
    "core*",
    "critic_service*",
    "data*",
    "evals*",
    "graph*",
    "mcp_server*",
    "observability*",
    "retrieval*",
    "storage*",
    "tools*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/", "^\\.venv/", "^var/", "^tests/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# Optional "ml" extra, imported lazily and not installed in CI. Its use is already typed
# as Any at the call sites.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires external services (Elasticsearch, network); skipped when unavailable",
]
addopts = "-ra"

[tool.coverage.run]
source = [
    "agents", "app", "auth", "core", "critic_service", "data", "evals", "graph", "mcp_server",
    "observability", "retrieval", "storage", "tools",
]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
