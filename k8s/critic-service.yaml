apiVersion: v1
kind: Service
metadata:
  name: sentinel-critic
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-critic
    app.kubernetes.io/part-of: sentinel-ai
spec:
  # Cluster-internal: only the API calls the critic.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sentinel-critic
  ports:
    - name: http
      port: 8100
      targetPort: http
