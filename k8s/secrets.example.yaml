# Example only. Do not commit a real copy of this file with values filled in.
# Create the real secret from the command line instead:
#
#   kubectl -n sentinel create secret generic sentinel-secrets \
#     --from-literal=API_KEYS='operator:<sha256>,admin:<sha256>' \
#     --from-literal=CRITIC_API_KEY='<critic key>' \
#     --from-literal=ANTHROPIC_API_KEY='' \
#     --from-literal=LANGSMITH_API_KEY=''
#   kubectl -n sentinel create secret generic sentinel-critic-secrets \
#     --from-literal=CRITIC_API_KEY_SHA256='<sha256 of the critic key>' \
#     --from-literal=ANTHROPIC_API_KEY=''
#
# API_KEYS holds SHA-256 hashes, never plaintext keys: python -m auth.api_keys <role>
# The critic key pair comes from python -m critic_service.keys: the API holds the key,
# the critic only its hash.
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel-ai
type: Opaque
stringData:
  API_KEYS: "operator:<sha256-of-operator-key>,admin:<sha256-of-admin-key>"
  CRITIC_API_KEY: "<critic-api-key>"
  ANTHROPIC_API_KEY: ""
  LANGSMITH_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-critic-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel-ai
type: Opaque
stringData:
  CRITIC_API_KEY_SHA256: "<sha256-of-critic-api-key>"
  ANTHROPIC_API_KEY: ""
