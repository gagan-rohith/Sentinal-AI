# Builds the search index, or rebuilds it when the document format or embedding model
# changed. Safe to run on every deploy: it exits quickly when the index is current.
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-ingest
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-ingest
    app.kubernetes.io/part-of: sentinel-ai
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-ingest
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: sentinel-ai-worker:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "retrieval.indexing", "--if-stale"]
          envFrom:
            - configMapRef:
                name: sentinel-config
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
